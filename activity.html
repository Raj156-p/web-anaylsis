<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Daily Grind | Your Activity</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>:root{--bg:#080807;--surface:#15140f;--gold:#d7b56d;--cream:#f4efe5;--muted:#aaa397}body{background:var(--bg);color:var(--cream);font-family:Inter,system-ui}.serif{font-family:Georgia,serif}.surface{background:var(--surface);border:1px solid rgba(215,181,109,.22);border-radius:24px}.gold{color:var(--gold)}.muted{color:var(--muted)}.progress{height:10px;background:#292821}.progress-bar{background:var(--gold)}</style></head><body><div class="container py-4"><nav class="d-flex justify-content-between"><a href="index.html" class="text-light text-decoration-none">THE DAILY GRIND</a><button id="logout" class="btn btn-outline-light">Logout</button></nav><div class="py-5"><div class="eyebrow gold">Your Activity</div><h1 class="serif display-3" id="hello">Your account</h1><div class="row g-4 mt-2"><div class="col-md-6"><div class="surface p-4"><div class="muted">Credits</div><div class="display-4 serif gold" id="credits">0</div><div id="tier" class="fw-bold">Bronze</div><div class="progress mt-3"><div id="bar" class="progress-bar"></div></div><small class="muted" id="progressText"></small><p class="mt-3 mb-0">Earn <b>1 credit per ₹10 spent</b>. Redeem 1 credit = ₹1 at checkout.</p></div></div><div class="col-md-6"><div class="surface p-4"><div class="row text-center g-3"><div class="col-4"><div class="display-6 serif" id="orders">0</div><small class="muted">Orders</small></div><div class="col-4"><div class="display-6 serif" id="cart">0</div><small class="muted">Cart items</small></div><div class="col-4"><div class="display-6 serif" id="views">0</div><small class="muted">Product views</small></div></div></div></div></div><div class="surface p-4 mt-4"><div class="d-flex justify-content-between align-items-center"><h2 class="serif h3">Recent Orders</h2><a href="menu.html" class="btn btn-sm btn-outline-light">Order again</a></div><div id="ordersList" class="mt-3"></div></div></div></div><script src="site.js"></script><script>const u=requireLogin();if(u){(async()=>{const user=await syncUser();hello.textContent=`Welcome, ${user.name}`;credits.textContent=user.credits;orders.textContent=user.orders_count;cart.textContent=user.cart_items;views.textContent=user.product_views;tier.textContent=user.tier+' tier';const c=Number(user.credits);const max=user.tier==='Bronze'?200:user.tier==='Silver'?500:1000;bar.style.width=Math.min(100,c/max*100)+'%';progressText.textContent=user.tier==='Gold'?`${c} credits · Gold unlocked`:`${c} / ${max} credits toward next tier`;const r=await fetch(API+'/api/orders/'+user.user_id);const d=await r.json();ordersList.innerHTML=d.orders.length?d.orders.slice(-8).reverse().map(o=>`<div class="border-bottom border-secondary py-3"><div class="d-flex justify-content-between"><b>${o.order_number}</b><span class="gold">${moneyINR(o.total)}</span></div><small class="muted">${o.outlet} · ${o.order_type} · ${o.created_at.slice(0,10)}</small></div>`).join(''):'<p class="muted">No orders yet.</p>'})();}logout.onclick=()=>{localStorage.removeItem('dailyGrindUser');location.href='index.html'}</script></body></html>

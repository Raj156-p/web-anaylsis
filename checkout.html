<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Daily Grind | Checkout</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>:root{--bg:#080807;--surface:#15140f;--gold:#d7b56d;--cream:#f4efe5;--muted:#aaa397;--line:rgba(215,181,109,.22)}body{background:var(--bg);color:var(--cream);font-family:Inter,system-ui}.serif{font-family:Georgia,serif}.surface{background:var(--surface);border:1px solid var(--line);border-radius:22px}.gold,.price{color:var(--gold)}.muted{color:var(--muted)}.form-control,.form-select{background:#10100e!important;border:1px solid #34322b!important;color:var(--cream)!important;border-radius:12px;padding:.8rem}.btn-gold{background:var(--gold);border:0;color:#111;border-radius:999px;font-weight:700}.qty button{border:1px solid var(--gold);background:none;color:var(--gold);border-radius:50%;width:32px;height:32px}.summary{position:sticky;top:90px}.strike{text-decoration:line-through;color:#777}@media(max-width:991px){.summary{position:static}}</style></head><body><nav class="navbar navbar-dark sticky-top" style="background:#080807e8;border-bottom:1px solid var(--line)"><div class="container py-2"><a class="navbar-brand serif" href="menu.html">← THE DAILY GRIND</a><a class="btn btn-outline-light" href="activity.html" data-account>Login / Sign up</a></div></nav><main class="container py-5"><div id="app"><h1 class="serif display-4 mb-4">Checkout</h1><div class="row g-4"><div class="col-lg-7"><div class="surface p-4"><h2 class="serif h3">Your order</h2><div id="items"></div><div class="mt-4"><label class="form-label">Order notes</label><textarea id="notes" class="form-control" rows="3" placeholder="Less sugar, extra napkins, etc."></textarea></div></div><div class="surface p-4 mt-4"><h2 class="serif h3">Delivery details</h2><input id="name" class="form-control mb-3" placeholder="Full name"><input id="phone" class="form-control mb-3" placeholder="Phone number"><textarea id="address" class="form-control mb-3" rows="3" placeholder="Full delivery address"></textarea><select id="outlet" class="form-select mb-3"><option>Bandra West</option><option>Lower Parel</option><option>Powai</option></select><div class="row g-2"><div class="col-md-6"><select id="type" class="form-select"><option value="Pickup">Pickup</option><option value="Standard Delivery">Standard Delivery</option><option value="Urgent Delivery">Urgent Delivery</option></select></div><div class="col-md-6"><select id="payment" class="form-select"><option>UPI</option><option>Card</option><option>Pay at counter</option></select></div></div></div></div><div class="col-lg-5"><div class="surface p-4 summary"><h2 class="serif h3">Summary</h2><div class="d-flex justify-content-between"><span class="muted">Subtotal</span><b id="subtotal">₹0.00</b></div><div class="d-flex justify-content-between"><span class="muted">Tax (8%)</span><b id="tax">₹0.00</b></div><div class="d-flex justify-content-between"><span class="muted">Delivery</span><b id="delivery">₹0.00</b></div><div class="d-flex justify-content-between"><span class="muted">Urgent fee</span><b id="urgent">₹0.00</b></div><hr><div class="d-flex justify-content-between"><span>Credits</span><span class="gold" id="creditsLabel">0</span></div><div class="input-group mt-2 mb-2"><input id="redeem" type="number" min="0" class="form-control" placeholder="Credits to redeem"><button class="btn btn-outline-light" id="applyCredits">Apply</button></div><small class="muted">1 credit = ₹1. Free standard delivery above ₹499.</small><div class="d-flex justify-content-between fs-4 mt-4"><span>Total</span><b class="price" id="total">₹0.00</b></div><button id="place" class="btn btn-gold w-100 py-3 mt-4">Place order</button><div id="msg" class="mt-3"></div></div></div></div></div></main><script src="site.js"></script><script>const u=requireLogin();if(u){syncUser().then(user=>{document.getElementById('name').value=user.name;phone.value=user.phone;creditsLabel.textContent=user.credits;render()})}let redeem=0;function render(){const c=getCart();items.innerHTML='';if(!c.length){items.innerHTML='<p class="muted py-4">Your cart is empty. <a href="menu.html" class="gold">Browse menu</a></p>';place.disabled=true;return}let sub=0;c.forEach((x,i)=>{sub+=x.price*x.quantity;items.insertAdjacentHTML('beforeend',`<div class="d-flex gap-3 py-3 border-bottom border-secondary"><div class="flex-grow-1"><b>${x.name}</b><div class="muted">${moneyINR(x.price)} each</div><div class="qty mt-2"><button data-q="-" data-i="${i}">−</button><span class="mx-2">${x.quantity}</span><button data-q="+" data-i="${i}">+</button><button class="btn btn-sm btn-link text-danger" data-remove="${i}">Remove</button></div></div><b>${moneyINR(x.price*x.quantity)}</b></div>`)});const tax=sub*.08;const t=type.value;const del=t==='Standard Delivery'?(sub>=499?0:49):0;const urgentFee=t==='Urgent Delivery'?79:0;const maxRedeem=Math.min(redeem,Number(currentUser().credits));const total=Math.max(0,sub+tax+del+urgentFee-maxRedeem);subtotal.textContent=moneyINR(sub);document.getElementById('tax').textContent=moneyINR(tax);delivery.textContent=moneyINR(del);urgent.textContent=moneyINR(urgentFee);document.getElementById('total').textContent=moneyINR(total)}
document.addEventListener('click',e=>{const q=e.target.closest('[data-q]');if(q){const c=getCart(),i=+q.dataset.i;c[i].quantity=q.dataset.q==='+'?c[i].quantity+1:Math.max(1,c[i].quantity-1);saveCart(c);render()}const r=e.target.closest('[data-remove]');if(r){const c=getCart();c.splice(+r.dataset.remove,1);saveCart(c);render()}});['type','redeem'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(id==='redeem')redeem=Math.max(0,+redeemInput());render()}));function redeemInput(){return document.getElementById('redeem').value||0}applyCredits.onclick=()=>{redeem=Math.max(0,+redeemInput());render()};place.onclick=async()=>{const c=getCart();if(!c.length)return;const user=currentUser();const sub=c.reduce((a,x)=>a+x.price*x.quantity,0),tax=sub*.08,t=type.value,del=t==='Standard Delivery'?(sub>=499?0:49):0,uf=t==='Urgent Delivery'?79:0,red=Math.min(redeem,Number(user.credits));const order={order_number:'DG-'+Date.now().toString(36).toUpperCase(),created_at:new Date().toISOString(),user_id:user.user_id,customer_name:document.getElementById('name').value,customer_email:user.email,phone:phone.value,address:address.value,outlet:outlet.value,order_type:t,payment_method:payment.value,products:c,subtotal:sub,tax,delivery_fee:del,urgent_fee:uf,credits_redeemed:red,total:Math.max(0,sub+tax+del+uf-red),notes:notes.value};if(!order.customer_name||!order.phone||!order.address)return msg.innerHTML='<div class="alert alert-warning">Please enter your full name, phone number and delivery address.</div>';place.disabled=true;const r=await fetch(API+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)});const d=await r.json();if(!r.ok){place.disabled=false;return msg.innerHTML='<div class="alert alert-danger">'+d.error+'</div>'}localStorage.setItem('dailyGrindUser',JSON.stringify(d.user));saveCart([]);msg.innerHTML=`<div class="alert alert-success">Order <b>${d.order_number}</b> confirmed. You earned ${d.credits_earned} credits.</div>`;track('order_completed',{order_number:d.order_number,total:d.total,credits_earned:d.credits_earned});render()};render();</script></body></html>

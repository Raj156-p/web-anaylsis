<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Daily Grind | Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>:root{--bg:#080807;--surface:#15140f;--gold:#d7b56d;--cream:#f4efe5;--muted:#aaa397}body{background:var(--bg);color:var(--cream);font-family:Inter,system-ui}.serif{font-family:Georgia,serif}.surface{background:var(--surface);border:1px solid rgba(215,181,109,.22);border-radius:24px}.form-control{background:#10100e;border:1px solid #34322b;color:var(--cream);padding:.85rem;border-radius:12px}.btn-gold{background:var(--gold);border:0;border-radius:999px;font-weight:700;padding:.85rem}.muted{color:var(--muted)}</style></head><body><div class="container py-5" style="max-width:760px"><a class="text-decoration-none text-light" href="index.html">← THE DAILY GRIND</a><div class="surface p-4 p-lg-5 mt-4"><div class="d-flex gap-2 mb-4"><button class="btn btn-gold flex-fill" id="loginTab">Login</button><button class="btn btn-outline-light flex-fill" id="signupTab">Sign up</button></div><div id="msg" class="mb-3"></div><form id="login"><h1 class="serif">Welcome back.</h1><p class="muted">Sign in first so your activity, cart and orders stay connected across visits.</p><input class="form-control mb-3" id="le" type="email" placeholder="Email" required><input class="form-control mb-3" id="lp" type="password" placeholder="Password" required><button class="btn btn-gold w-100">Login</button></form><form id="signup" style="display:none"><h1 class="serif">Create your account.</h1><p class="muted">Inspired by modern loyalty flows: one account keeps rewards and ordering history together.</p><input class="form-control mb-3" id="sn" placeholder="Full name" required><input class="form-control mb-3" id="se" type="email" placeholder="Email" required><input class="form-control mb-3" id="sp" placeholder="Phone number" required><input class="form-control mb-3" id="spp" type="password" placeholder="Password (6+ characters)" minlength="6" required><button class="btn btn-gold w-100">Create account</button></form></div></div><script src="site.js"></script><script>const msg=document.getElementById('msg');const login=document.getElementById('login'),signup=document.getElementById('signup');function show(m,ok=false){msg.className='mb-3 alert '+(ok?'alert-success':'alert-danger');msg.textContent=m}loginTab.onclick=()=>{login.style.display='block';signup.style.display='none';loginTab.className='btn btn-gold flex-fill';signupTab.className='btn btn-outline-light flex-fill'};signupTab.onclick=()=>{login.style.display='none';signup.style.display='block';loginTab.className='btn btn-outline-light flex-fill';signupTab.className='btn btn-gold flex-fill'};login.onsubmit=async e=>{e.preventDefault();const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:le.value,password:lp.value})});const d=await r.json();if(!r.ok)return show(d.error);localStorage.setItem('dailyGrindUser',JSON.stringify(d.user));location.href=new URLSearchParams(location.search).get('next')||'activity.html'};signup.onsubmit=async e=>{e.preventDefault();const r=await fetch(API+'/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:sn.value,email:se.value,phone:sp.value,password:spp.value})});const d=await r.json();if(!r.ok)return show(d.error);localStorage.setItem('dailyGrindUser',JSON.stringify(d.user));location.href='activity.html'}</script></body></html>
